# --- Prefix Key ---
unbind C-b
set-option -g prefix C-f
bind-key C-f send-prefix

# Used to clear the terminal
bind-key M-k send-keys C-l

# --- Reload Config Easily ---
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# --- Mouse Support ---
set -g mouse on

# Misc config
set-option -g base-index 1
set-option -g pane-base-index 1
set -g renumber-windows on       # renumber all windows when any window is closed
set-option -g allow-rename off
set-window-option -g automatic-rename off

# --- 256 Color Support ---
set -g default-terminal "tmux-256color"
# set -as terminal-features ',xterm*:RGB'


# List of plugins
# set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'rose-pine/tmux'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'b0o/tmux-autoreload'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tpm'

# Themes
set -g @auto_theme_light_variant 'dawn'
set -g @auto_theme_dark_variant 'main'
set -g @auto_theme_poll_interval '5'

if-shell 'uname | grep -q Darwin && osascript -e "tell app \"System Events\" to tell appearance preferences to get dark mode" | grep -q true' \
  'set -g @rose_pine_variant "main"' \
  'set -g @rose_pine_variant "dawn"'

if-shell 'uname | grep -q Darwin' 'run-shell -b "~/.tmux/scripts/auto-theme.sh"'

# --- Pane Navigation ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Split Panes ---
bind | split-window -h
bind - split-window -v

# --- Pane Resizing ---
bind -r < resize-pane -L 5
bind -r > resize-pane -R 5
bind -r + resize-pane -U 5
bind -r _ resize-pane -D 5

# --- Window Management ---
bind c new-window -c "#{pane_current_path}"
bind s new-session -c "#{pane_current_path}"
bind & kill-window
bind % kill-pane
bind @ kill-session
bind n next-window
bind p previous-window

# --- Visual Improvements ---
set -g status-right-length 100
set -g status-left-length 100

# --- Status Bar Styling ---
set-option -g status-position top


run '~/.tmux/plugins/tpm/tpm'

# Make the active session/window/pane obvious after the theme plugins load
run-shell -b "~/.tmux/scripts/focus-overrides.sh"
